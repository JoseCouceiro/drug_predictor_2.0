raw_csv_files:
  type: PartitionedDataSet
  path: data/01_raw/csv_files
  filename_suffix: ".csv"
  dataset:
    type: pandas.CSVDataSet

# Consumed by 4 downstream nodes (drug classifier + default/action/organ ATC
# classifiers). Kedro's default MemoryDataSet deepcopies on each load, and
# deep-copying a Keras model does an internal pickle round-trip that fails.
# None of the consumers mutate this model in place (they only read layers/
# weights via _clone_conv1d_backbone), so sharing the same reference is safe.
selected_lipinski_backbone:
  type: MemoryDataSet
  copy_mode: assign

featurized_data:
  type: PartitionedDataSet
  path: data/05_model_input/featurized_data
  dataset:
    type: pandas.ParquetDataSet
    filepath: dummy.parquet

# Small provenance summary from the current run only (partitions processed
# in memory are written straight to disk now — see process_new_partitions).
featurized_data_summary:
  type: json.JSONDataSet
  filepath: data/08_reporting/featurized_data_summary.json

# ================================
# Lipinski model outputs
# ================================

# Trained Keras model
lipinski_model:
  type: pickle.PickleDataSet
  filepath: data/06_models/lipinski_model.pkl
  backend: pickle

# Training history (includes training & validation metrics per epoch)
lipinski_training_history:
  type: json.JSONDataSet
  filepath: data/08_reporting/lipinski_training_history.json

# Predictions on the training/test set
lipinski_train_predictions:
  type: pandas.CSVDataSet
  filepath: data/07_model_output/lipinski_train_predictions.csv

# Classification report on the training/test set
lipinski_train_report:
  type: text.TextDataSet
  filepath: data/08_reporting/lipinski_train_report.txt

# Predictions on the validation set
lipinski_val_predictions:
